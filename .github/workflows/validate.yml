name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          # Oldest supported interpreter, Linux only.
          - os: ubuntu-latest
            python-version: "3.10"
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/one-context[dev]"

      - name: Unit tests
        working-directory: packages/one-context
        run: pytest -q

      - name: Validate sample workspace (doctor)
        run: onecxt doctor

      - name: Generate tool surfaces (adapt)
        run: onecxt adapt dev

      - name: Verify regeneration is deterministic (adapt --check)
        run: onecxt adapt dev --check

      - name: Tracked AGENTS.md must match generation
        run: git diff --exit-code -- AGENTS.md
