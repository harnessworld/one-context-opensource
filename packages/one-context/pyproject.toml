[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-context"
version = "0.1.0"
description = "one-context — multi-repository AI workspace control plane (CLI: onecxt)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "one-context contributors"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "pydantic>=2.5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/harnessworld/one-context-opensource"
Repository = "https://github.com/harnessworld/one-context-opensource"
Issues = "https://github.com/harnessworld/one-context-opensource/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
onecxt = "one_context.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
  "slow: 真接 LLM 的端到端测试，默认 skip；本地 `pytest -m slow` 才跑（消耗 token）",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["one_context*"]
